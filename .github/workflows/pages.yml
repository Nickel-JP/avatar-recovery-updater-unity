name: Verify and deploy public distribution

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      allow_initial_publication:
        description: Allow the approved one-time first GitHub Pages publication
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: public-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Checkout complete immutable history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact distribution and publication history
        shell: pwsh
        env:
          BEFORE_SHA: ${{ github.event.before || github.event.pull_request.base.sha || '' }}
          ALLOW_INITIAL_PUBLICATION: ${{ inputs.allow_initial_publication || 'false' }}
        run: |
          $arguments = @{}
          if (-not [string]::IsNullOrEmpty($env:BEFORE_SHA)) {
            $arguments.BeforeSha = $env:BEFORE_SHA
          }
          if ($env:ALLOW_INITIAL_PUBLICATION -ceq "true") {
            $arguments.AllowInitialPublication = $true
          }
          & .\Verify-PublicDistribution.ps1 @arguments

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload verified Pages payload
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
