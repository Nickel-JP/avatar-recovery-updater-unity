name: Verify and deploy public distribution

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      allow_initial_publication:
        description: Allow the approved one-time first GitHub Pages publication
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: public-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Checkout complete immutable history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact distribution and publication history
        shell: pwsh
        env:
          BEFORE_SHA: ${{ github.event.before || github.event.pull_request.base.sha || '' }}
          ALLOW_INITIAL_PUBLICATION: ${{ inputs.allow_initial_publication || 'false' }}
        run: |
          $arguments = @{}
          if (-not [string]::IsNullOrEmpty($env:BEFORE_SHA)) {
            $arguments.BeforeSha = $env:BEFORE_SHA
          }
          if ($env:ALLOW_INITIAL_PUBLICATION -ceq "true") {
            $arguments.AllowInitialPublication = $true
          }
          & .\Verify-PublicDistribution.ps1 @arguments

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload verified Pages payload
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: ./site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
